name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npx oxlint src
          npm run build

      - name: Backend
        run: |
          dotnet build StreamZH.slnx -c Release
          dotnet test StreamZH.slnx -c Release --no-build

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/StreamZH.Host -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o out/StreamZH

      - uses: actions/upload-artifact@v4
        with:
          name: StreamZH-${{ matrix.rid }}
          path: out/StreamZH
          retention-days: 14
