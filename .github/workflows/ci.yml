name: CI

# Every push: build and test only (about 3 minutes).
# Docker image and the five platform packages only when started by hand
# (Actions -> CI -> Run workflow) or for a version tag like v0.3.0.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npx oxlint src
          npm run build

      - name: Backend
        run: |
          dotnet build StreamZH.slnx -c Release
          dotnet test StreamZH.slnx -c Release --no-build

  docker:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: streamzh:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name streamzh -p 9797:9797 streamzh:ci
          for i in $(seq 1 30); do curl -fs http://localhost:9797/health && break; sleep 1; done
          curl -fs http://localhost:9797/api/v1/auth/state
          curl -fs -o /dev/null http://localhost:9797/
          docker logs streamzh

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/StreamZH.Host -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o out/StreamZH

      # Windows package: the tray icon next to StreamZH.exe (framework-dependent, needs the .NET 10 Desktop Runtime).
      - name: Tray icon
        if: matrix.rid == 'win-x64'
        run: >
          dotnet publish src/StreamZH.Tray -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none -o out/StreamZH

      - uses: actions/upload-artifact@v4
        with:
          name: StreamZH-${{ matrix.rid }}
          path: out/StreamZH
          retention-days: 14
