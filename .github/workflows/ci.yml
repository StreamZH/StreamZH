name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npx oxlint src
          npm run build

      - name: Backend
        run: |
          dotnet build StreamZH.slnx -c Release
          dotnet test StreamZH.slnx -c Release --no-build
