name: CI

# Pushes to main and pull requests: build and test (about 3 minutes), plus a check of the packaging scripts.
# Release packages, the Docker image and the GitHub release come from release.yml (tags v*).
# Actions are pinned to a commit (the version is in the comment); Dependabot proposes updates (.github/dependabot.yml).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npx oxlint src
          npm run build

      - name: Backend
        run: |
          dotnet build StreamZH.slnx -c Release
          dotnet test StreamZH.slnx -c Release --no-build

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell scripts
        run: |
          shellcheck tools/install-linux.sh docker/entrypoint.sh packaging/linux/build.sh packaging/linux/scripts/*.sh \
            packaging/check-repository.sh

      # The docs, the compose example and AppInfo.Repository name the same repository (SV4 X-01).
      - name: Repository names
        run: packaging/check-repository.sh

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = 0
          foreach ($file in Get-ChildItem -Path tools, packaging, tests/scripts -Recurse -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed++ }
          }
          exit $failed

      # The decisions of the service scripts that do not need Windows (data folder owner, quoting).
      - name: PowerShell script tests
        shell: pwsh
        run: ./tests/scripts/ServiceHelpers.Tests.ps1
