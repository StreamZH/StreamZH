# StreamZH with Docker Compose - an example to copy and adapt.
#
#   mkdir -p /srv/streamzh && cd /srv/streamzh
#   curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/cloudzh/streamzh/main/docker/docker-compose.example.yml
#   (adapt the paths below)
#   docker compose up -d
#
# Then open http://<your server>:9797 and create the first user. Seen from inside the container your browser is
# "another device", so the setup page asks for the one-time setup code: `docker logs streamzh` shows it (also in
# ./config/setup-code). See docs/SECURITY.md for safe deployment and docs/MIGRATION.md for moving over from
# Sonarr, Radarr, Prowlarr and SABnzbd.
#
# Updates: `docker compose pull && docker compose up -d`. Your data in ./config stays.
#
# Paths: mount your media and download folders at the SAME paths inside the container as the old apps use (e.g.
# /data/media/movies, /data/media/tv, /data/downloads). Then the migration wizard needs no path mappings and
# StreamZH finds every file Radarr and Sonarr know about.

services:
  streamzh:
    # Released image: ":latest" (newest release), ":1.0" (newest 1.0.x) or an exact version like ":1.0.0".
    image: ghcr.io/cloudzh/streamzh:latest
    # To build from a checkout instead, remove "image" above and use (paths relative to this file):
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: streamzh
    restart: unless-stopped

    environment:
      # The user and group StreamZH runs as (`id -u` / `id -g` of the user that owns your media). The container starts
      # as root only to give /config to this user, then drops to it. Never use 0 (root).
      PUID: "1000"
      PGID: "1000"
      # 027 (the default): new files are readable for the group (Plex or Jellyfin in the same group can read the
      # media), not for others. "002" makes them writable for the group too. StreamZH's own data in /config stays
      # private either way.
      UMASK: "027"
      TZ: "Etc/UTC"

    ports:
      # The web UI/API port. To reach StreamZH only through a reverse proxy on this host, use
      # "127.0.0.1:9797:9797" instead. Keep 9797 inside the container (change the left number to publish another port).
      - "9797:9797"
      # The built-in torrent engine's port for incoming peers (its "Listening port" setting). Only needed when you use
      # it; forward it on your router for better speeds. Keep the same number on both sides and in the settings.
      - "51414:51414/tcp"
      - "51414:51414/udp"

    volumes:
      # Database, settings, logs, backups. Back this folder up.
      - ./config:/config
      # Media and downloads: same paths as in Sonarr/Radarr/SABnzbd (left: on the host, right: in the container).
      - /data/media:/data/media
      - /data/downloads:/data/downloads

    # No privileges beyond what the entrypoint needs to switch to PUID:PGID.
    security_opt:
      - no-new-privileges:true

    # The image has a health check on /health (no login needed); `docker ps` shows "healthy".
